<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>视听工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111a2b'/%3E%3Cpath d='M9 11h9a4 4 0 010 8h-2l5 4h-4l-5-4H9z' fill='%236aa8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/pages.css">
<link rel="stylesheet" href="/static/css/fm.css">
<link rel="stylesheet" href="/static/css/player.css">
</head>
<body>
<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5h9a4 4 0 010 8H9l5 6H9L4 13z" fill="currentColor"/></svg>
    </div>
    <div class="brand-text">
      <strong>视听工作台</strong>
      <span>AV Workbench</span>
    </div>
  </div>

  <nav class="nav" aria-label="主导航">
    <a class="nav-item" href="#/dashboard" data-nav="dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/></svg>
      <span>总览</span>
    </a>
    <a class="nav-item" href="#/transcribe" data-nav="transcribe">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11h-2z"/></svg>
      <span>字幕转写</span>
    </a>
    <a class="nav-item" href="#/projects" data-nav="projects">
      <svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
      <span>项目库</span>
      <span class="nav-badge" id="nav-project-count" hidden></span>
    </a>
    <a class="nav-item" href="#/editor" data-nav="editor">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 15h6v2H6zM6 11h12v2H6z"/></svg>
      <span>字幕编辑</span>
    </a>
    <a class="nav-item" href="#/transcode" data-nav="transcode">
      <svg viewBox="0 0 24 24"><path d="M4 8h11l-3-3 1.4-1.4L18.8 9 13.4 14.4 12 13l3-3H4V8zm16 8H9l3 3-1.4 1.4L5.2 15l5.4-5.4L12 11l-3 3h11v2z"/></svg>
      <span>视频转码</span>
    </a>
    <a class="nav-item" href="#/analyze" data-nav="analyze">
      <svg viewBox="0 0 24 24"><path d="M4 19h16v2H4zM6 10h3v7H6zM10.5 5h3v12h-3zM15 12h3v5h-3z"/></svg>
      <span>媒体分析</span>
    </a>
    <div class="nav-sep"></div>
    <a class="nav-item" href="#/models" data-nav="models">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>模型中心</span>
    </a>
    <a class="nav-item" href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-1.7-1L15 3H9l-.3 2.6c-.6.2-1.2.6-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1L9 21h6l.3-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>设置</span>
    </a>
  </nav>

  <!-- 当前媒体：跨页面保留，可被转写/转码/分析/编辑复用 -->
  <div class="now-media" id="now-media"></div>

  <div class="sidebar-foot">
    <div class="engine-chip" id="engine-chip" title="当前识别引擎">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-label">检测中…</span>
    </div>
    <div class="sidebar-meta">
      <span id="app-version">v3.0.0</span>
      <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4m0-14.2l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
</aside>

<!-- 主区域 -->
<div class="shell">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-toggle" aria-label="展开导航">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
    </button>
    <div class="crumbs" id="crumbs"></div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="quick-drop-btn">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
        导入文件
      </button>
      <button class="icon-btn" id="jobs-toggle" title="任务中心" aria-label="任务中心">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <span class="badge-dot" id="jobs-badge" hidden></span>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<!-- 任务抽屉 -->
<aside class="drawer" id="jobs-drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>任务中心</h3>
    <button class="icon-btn" id="jobs-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="jobs-list"></div>
</aside>
<div class="drawer-mask" id="jobs-mask" hidden></div>

<!-- 全局拖拽遮罩 -->
<div class="drop-overlay" id="drop-overlay">
  <div class="drop-card">
    <svg viewBox="0 0 24 24" width="40" height="40"><path d="M12 16V4m0 0L7 9m5-5l5 5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    <strong>松开即可导入</strong>
    <span>视频 / 音频都行，导入后可直接转写、分析或转码</span>
  </div>
</div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="hidden-file" hidden multiple accept="audio/*,video/*,.mp4,.mkv,.mov,.avi,.webm,.m4a,.mp3,.wav,.flac,.aac,.ogg">

<!-- 轻提示与模态框 -->
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
